<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C++ untuk Competitive Programming</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#2563eb;--accent-light:#dbeafe;--accent-dark:#1d4ed8;
  --bg:#f8fafc;--bg2:#ffffff;--bg3:#f1f5f9;--border:#e2e8f0;
  --text:#0f172a;--text2:#475569;--text3:#94a3b8;
  --success:#16a34a;--success-bg:#dcfce7;
  --error:#dc2626;--error-bg:#fee2e2;
  --warn:#d97706;--warn-bg:#fef3c7;
  --code-bg:#1e293b;--code-text:#e2e8f0;
  --r:10px;--rs:6px;
  --sh:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --tr:.2s ease;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --mono:'Cascadia Code','Fira Code','Consolas','Courier New',monospace;
  --sw:260px;
}
[data-theme="dark"]{
  --bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--border:#334155;
  --text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;
  --accent-light:#1e3a8a;--code-bg:#0f172a;
  --success-bg:#14532d;--error-bg:#7f1d1d;--warn-bg:#78350f;
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}

/* ── LAYOUT ── */
.app{display:flex;flex:1;min-height:100vh}
.sidebar{width:var(--sw);background:var(--bg2);border-right:1px solid var(--border);position:fixed;left:0;top:0;height:100vh;z-index:100;display:flex;flex-direction:column;overflow-y:auto;transition:transform var(--tr)}
.sidebar-logo{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:.95rem;font-weight:800;color:var(--accent);line-height:1.3}
.sidebar-logo span{font-size:.72rem;color:var(--text2)}
.sidebar-progress{padding:12px 16px;border-bottom:1px solid var(--border)}
.prog-label{font-size:.72rem;color:var(--text2);display:flex;justify-content:space-between;margin-bottom:6px}
.prog-track{height:6px;background:var(--bg3);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.sidebar-nav{flex:1;padding:8px}
.nav-btn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--rs);cursor:pointer;border:none;background:none;width:100%;text-align:left;color:var(--text);font-size:.85rem;transition:background var(--tr);font-family:var(--font)}
.nav-btn:hover{background:var(--bg3)}
.nav-btn.active{background:var(--accent-light);color:var(--accent);font-weight:600}
.nav-btn:disabled{opacity:.5;cursor:not-allowed}
.nav-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nav-status{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0}
.s-done{background:var(--success);color:#fff}.s-going{background:var(--accent);color:#fff}.s-none{background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.sidebar-foot{padding:12px 16px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.main{margin-left:var(--sw);flex:1;display:flex;flex-direction:column;min-height:100vh}
.topbar{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;z-index:50}
.topbar-title{font-weight:600;font-size:1rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-menu{display:none}
.mobile-mod-select{display:none;background:var(--bg3);color:var(--text);border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;font-size:.82rem;font-family:var(--font);max-width:160px;outline:none}
.content{flex:1;padding:32px 24px;max-width:900px;margin:0 auto;width:100%}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--rs);border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:.875rem;font-family:var(--font);cursor:pointer;transition:background var(--tr),border-color var(--tr),color var(--tr);font-weight:500}
.btn:hover{background:var(--bg3)}.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn-success{background:var(--success);color:#fff;border-color:var(--success)}
.btn-sm{padding:5px 12px;font-size:.8rem}.btn-icon{padding:7px;line-height:1}
.theme-btn{background:none;border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;cursor:pointer;color:var(--text);font-size:.82rem;display:inline-flex;align-items:center;gap:5px;font-family:var(--font);transition:background var(--tr)}
.theme-btn:hover{background:var(--bg3)}

/* ── HOME ── */
.home-h2{font-size:1.6rem;font-weight:800;margin-bottom:8px}
.modules-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-top:24px}
.m-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:20px;cursor:pointer;transition:box-shadow var(--tr),border-color var(--tr),transform var(--tr)}
.m-card:hover{box-shadow:var(--sh);border-color:var(--accent);transform:translateY(-2px)}.m-card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.m-card.soon{opacity:.6;cursor:not-allowed}.m-card.soon:hover{transform:none;border-color:var(--border);box-shadow:none}
.badge{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;display:inline-block;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.badge-done{background:var(--success-bg);color:var(--success)}.badge-going{background:var(--accent-light);color:var(--accent)}.badge-none{background:var(--bg3);color:var(--text3)}.badge-soon{background:var(--warn-bg);color:var(--warn)}
.card-num{font-size:.72rem;color:var(--text3);margin-bottom:3px}.card-title{font-size:1.05rem;font-weight:700;margin-bottom:6px}.card-sum{font-size:.85rem;color:var(--text2);margin-bottom:10px;line-height:1.5}.card-meta{font-size:.72rem;color:var(--text3)}

/* ── SECTION SYSTEM ── */
.sec{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px;position:relative}
.sec-label{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.sec-status-icon{font-size:.9rem}
.sec-lock-banner{display:none;align-items:center;justify-content:center;gap:12px;padding:24px;background:var(--bg3);border:2px dashed var(--border);border-radius:var(--rs);color:var(--text3);font-size:.88rem;text-align:center;flex-direction:column}
.sec-lock-banner .lock-icon{font-size:1.8rem;margin-bottom:4px}
.sec.locked .sec-lock-banner{display:flex}.sec.locked .sec-content{display:none}
.sec.active .sec-lock-banner,.sec.done .sec-lock-banner{display:none}
.sec.active .sec-content,.sec.done .sec-content{display:block}
.sec.revealing .sec-content{animation:revealDown .4s ease}
@keyframes revealDown{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* section progress bar */
.sec-prog-bar{display:flex;align-items:center;gap:4px;padding:12px 0 20px;overflow-x:auto;scrollbar-width:none}
.sec-prog-bar::-webkit-scrollbar{display:none}
.sp-pill{display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-size:.74rem;font-weight:500;white-space:nowrap;flex-shrink:0;cursor:pointer;user-select:none;transition:background .2s,color .2s,border-color .2s}
.sp-pill:hover{border-color:var(--accent)}
.sp-pill.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent);font-weight:600}
.sp-pill.done{background:var(--success-bg);color:var(--success);border-color:var(--success)}
.sp-arrow{color:var(--border);font-size:.8rem;flex-shrink:0}

/* checkpoint button */
.checkpoint-btn{display:block;width:100%;margin-top:20px;padding:12px;border:2px dashed var(--accent);border-radius:var(--rs);background:var(--accent-light);color:var(--accent);font-size:.88rem;font-weight:700;cursor:pointer;font-family:var(--font);text-align:center;transition:background var(--tr),transform var(--tr)}
.checkpoint-btn:hover{background:var(--accent);color:#fff;transform:none}
.checkpoint-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── ANALOGY ── */
.analogy{background:var(--accent-light);border-left:4px solid var(--accent);border-radius:0 var(--rs) var(--rs) 0;padding:16px 20px;font-size:.93rem;line-height:1.75}
.analogy-emoji{font-size:1.6rem;display:block;margin-bottom:10px}

/* rack visual */
.rack-visual{margin-top:20px}
.rack-vis-label{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:6px}
.rack-row{display:flex;align-items:stretch;gap:4px;padding:10px;background:var(--bg3);border:2px solid var(--border);border-radius:var(--rs);margin-bottom:12px}
.rack-slot{width:46px;min-height:56px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--bg2);font-family:var(--mono);font-size:.82rem;font-weight:600}
.rack-slot.filled{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.rack-slot.empty{opacity:.35;border-style:dashed}
.rack-slot.overflow{background:var(--error-bg);border-color:var(--error);color:var(--error);animation:shake .4s ease}
.rack-plus{width:46px;min-height:56px;border:2px dashed var(--success);border-radius:6px;display:flex;align-items:center;justify-content:center;background:var(--success-bg);color:var(--success);font-size:1.4rem;animation:softPulse 2s ease-in-out infinite}
.rack-note{font-size:.8rem;color:var(--text2);margin-top:4px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes softPulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── EXPLANATION CARDS ── */
.exp-cards{display:flex;flex-direction:column;gap:14px}
.exp-card{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:start;background:var(--bg3);border-radius:var(--rs);padding:14px 16px;border:1px solid var(--border)}
.exp-icon{width:46px;height:46px;border-radius:var(--rs);background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
.exp-body h4{font-size:.93rem;font-weight:700;margin-bottom:5px}
.exp-body p{font-size:.85rem;color:var(--text2);line-height:1.65}
.exp-diagram{margin-top:10px;padding:10px 12px;background:var(--bg2);border-radius:var(--rs);border:1px solid var(--border)}
.mini-vec{display:flex;align-items:flex-end;gap:4px;flex-wrap:wrap}
.mini-slot{display:flex;flex-direction:column;align-items:center;gap:2px}
.mini-cell{width:34px;height:34px;background:var(--bg2);border:1.5px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;font-weight:600}
.mini-cell.hl{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.mini-idx{font-size:.6rem;color:var(--text3);font-family:var(--mono)}
.mini-ptr{font-size:.7rem;color:var(--accent);font-weight:700;height:16px;display:flex;align-items:center}
.mini-label{font-size:.78rem;color:var(--text2);font-family:var(--mono);margin-left:8px;align-self:center}
code.il{font-family:var(--mono);background:var(--bg3);color:var(--accent);padding:1px 5px;border-radius:4px;font-size:.88em}

/* ── ANIMATION PLAYER ── */
.anim-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px}
.code-pane{background:var(--code-bg);border-radius:var(--rs);overflow:hidden;font-family:var(--mono);font-size:.82rem;line-height:1.9}
.code-pane-hdr{background:rgba(255,255,255,.05);padding:8px 14px;font-size:.72rem;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.code-lines{padding:10px 0}
.code-line{display:flex;padding:0 14px;transition:background .2s;min-height:1.9em}
.code-line.hi{background:#1e3a8a;border-left:3px solid var(--accent)}
.lnum{color:#475569;margin-right:14px;user-select:none;min-width:22px;text-align:right;flex-shrink:0}
.code-line.hi .lnum{color:#93c5fd}
.lcode{flex:1;color:var(--code-text);white-space:pre}
.kw{color:#93c5fd}.ty{color:#86efac}.fn{color:#fde68a}.st{color:#fca5a5}.nm{color:#c084fc}.cm{color:#64748b;font-style:italic}.pp{color:#f9a8d4}

/* visual pane */
.vis-pane{display:flex;flex-direction:column;gap:12px}
.vis-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:14px;min-height:90px}
.vis-title{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:10px}
.vec-vis{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;min-height:72px;position:relative}
.vec-slot{display:flex;flex-direction:column;align-items:center;gap:3px}
.slot-ptr{font-size:.82rem;color:var(--accent);opacity:0;transition:opacity .3s;height:18px;display:flex;align-items:center;justify-content:center;font-weight:700}
.vec-slot.ptr-active .slot-ptr{opacity:1;animation:ptBounce .5s ease}
@keyframes ptBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.vec-cell{width:46px;height:46px;background:var(--bg2);border:2px solid var(--border);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.9rem;font-weight:600;transition:background .25s,border-color .25s}
.vec-cell.hl{background:var(--accent-light);border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.18);animation:cellGlow .4s ease}
.vec-cell.new{animation:cellDrop .42s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes cellDrop{0%{transform:translateY(-28px) scale(.5);opacity:0}60%{transform:translateY(4px) scale(1.07)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes cellGlow{0%{box-shadow:0 0 0 0 rgba(37,99,235,.4)}50%{box-shadow:0 0 0 8px rgba(37,99,235,.1)}100%{box-shadow:0 0 0 3px rgba(37,99,235,.18)}}
.vec-idx{font-size:.65rem;color:var(--text3);font-family:var(--mono)}
.vars-vis{display:flex;gap:8px;flex-wrap:wrap;min-height:50px;align-items:flex-start}
.var-box{background:var(--bg2);border:2px solid var(--border);border-radius:var(--rs);padding:7px 12px;min-width:62px;text-align:center;transition:border-color .3s,background .3s}
.var-lbl{font-size:.68rem;color:var(--text3);font-family:var(--mono);margin-bottom:2px}
.var-val{font-family:var(--mono);font-size:.95rem;font-weight:700}
.loop-info{margin-top:8px;font-size:.78rem;color:var(--text2);font-family:var(--mono)}
.empty-hint{color:var(--text3);font-size:.8rem;font-style:italic}

/* step info & typewriter */
.step-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rs);padding:12px 16px;min-height:64px}
.step-ctr{font-size:.72rem;font-weight:700;color:var(--accent);margin-bottom:4px}
.step-desc{font-size:.88rem;color:var(--text2);line-height:1.65}
.tw-cursor{display:inline-block;width:2px;height:.9em;background:var(--accent);margin-left:2px;vertical-align:middle;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* controls */
.anim-ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.speed-ctrl{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:.75rem;color:var(--text2)}
.speed-ctrl input[type=range]{width:80px;accent-color:var(--accent)}

/* ── BENCHMARK VISUAL ── */
.bench-vis-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:14px}
.bench-track{display:flex;flex-direction:column;gap:4px}
.bench-label{font-size:.78rem;font-weight:600;color:var(--text)}
.bench-bar-track{height:16px;background:var(--bg3);border-radius:99px;overflow:hidden;position:relative}
.bench-bar-fill{height:100%;border-radius:99px;width:0%;transition:width .2s ease}
.bench-bar-fill.slow-fill{background:var(--error)}
.bench-bar-fill.fast-fill{background:var(--success)}
.bench-time{font-family:var(--mono);font-size:.78rem;color:var(--text2);margin-top:2px}

/* ── INTERACTIVE SANDBOX ── */
.sandbox-box{margin-top:20px;background:var(--bg3);border:2px solid var(--border);border-radius:var(--rs);overflow:hidden}
.sandbox-hdr{background:var(--accent-light);color:var(--accent);padding:10px 14px;font-weight:700;font-size:.85rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.sandbox-sub{font-size:.72rem;font-weight:400;color:var(--text2)}
.sandbox-body{padding:14px}
.sandbox-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.sb-input{width:90px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;font-family:var(--mono);font-size:.85rem;color:var(--text)}
.sandbox-vis-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:12px;margin-bottom:10px}
.sandbox-vis{display:flex;align-items:flex-end;gap:6px;flex-wrap:wrap;min-height:72px}
.sandbox-meta{display:flex;gap:16px;margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:.8rem;color:var(--text2);flex-wrap:wrap}
.sandbox-code-preview{background:var(--code-bg);border-radius:var(--rs);padding:8px 12px;font-family:var(--mono);font-size:.82rem;color:var(--code-text);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sb-code-label{color:#94a3b8;font-size:.72rem}

/* ── PREDICT OVERLAY ── */
.predict-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:200;padding:20px;backdrop-filter:blur(4px)}
.predict-overlay.show{display:flex}
.predict-card{background:var(--bg2);border-radius:var(--r);padding:28px;max-width:580px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:modalPop .35s cubic-bezier(.34,1.56,.64,1)}
@keyframes modalPop{from{transform:scale(.82) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.predict-emoji{font-size:2.4rem;margin-bottom:10px}
.predict-title{font-size:1.1rem;font-weight:800;margin-bottom:8px}
.predict-q{color:var(--text2);margin-bottom:10px;font-size:.93rem;line-height:1.65}
.predict-code-line{font-family:var(--mono);background:var(--code-bg);color:#fde68a;padding:8px 14px;border-radius:var(--rs);margin:0 0 16px;font-size:.88rem;display:inline-block}
.predict-pick{font-size:.72rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:10px}
.predict-opts{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.predict-opt{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--border);border-radius:var(--rs);cursor:pointer;background:var(--bg3);transition:border-color .18s,background .18s;font-family:var(--font);text-align:left;width:100%}
.predict-opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light)}
.predict-opt:disabled{cursor:not-allowed}
.predict-opt.p-correct{border-color:var(--success);background:var(--success-bg)}
.predict-opt.p-wrong{border-color:var(--error);background:var(--error-bg);animation:shake .3s ease}
.predict-mini-vec{display:flex;gap:4px;align-items:center}
.predict-mini-cell{width:34px;height:34px;background:var(--bg2);border:1.5px solid var(--border);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.8rem;font-weight:600;flex-shrink:0}
.predict-mini-cell.hl{background:var(--accent-light);border-color:var(--accent);color:var(--accent)}
.predict-opt.p-correct .predict-mini-cell{border-color:var(--success)}
.predict-opt.p-wrong .predict-mini-cell{border-color:var(--error)}
.predict-opt-label{font-size:.85rem;font-family:var(--mono);font-weight:600;color:var(--text2)}
.predict-fb{padding:12px 14px;border-radius:var(--rs);margin-bottom:14px;font-size:.88rem;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.predict-fb.correct{background:var(--success-bg);color:var(--success)}
.predict-fb.wrong{background:var(--error-bg);color:var(--error)}
.predict-skip{background:none;border:none;color:var(--text3);font-size:.8rem;cursor:pointer;font-family:var(--font);text-decoration:underline;padding:0}
.predict-skip:hover{color:var(--text2)}
.predict-footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* ── CODE BLOCK ── */
.cb-wrap{position:relative;margin:10px 0}
.cb{background:var(--code-bg);border-radius:var(--rs);padding:16px;overflow-x:auto;font-family:var(--mono);font-size:.84rem;line-height:1.85;color:var(--code-text)}
.cb-copy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#94a3b8;padding:4px 10px;border-radius:4px;font-size:.72rem;cursor:pointer;transition:background var(--tr);font-family:var(--font)}
.cb-copy:hover{background:rgba(255,255,255,.18)}

/* ── MISTAKES ── */
.mistake-list{list-style:none;display:flex;flex-direction:column;gap:10px}
.mistake{background:var(--error-bg);border-left:4px solid var(--error);border-radius:0 var(--rs) var(--rs) 0;padding:12px 16px;font-size:.88rem;line-height:1.6}
.mistake-title{font-weight:700;color:var(--error);margin-bottom:4px}

/* ── QUIZ ── */
.quiz-wrap{display:flex;flex-direction:column;gap:18px}
.quiz-item{border:1px solid var(--border);border-radius:var(--rs);overflow:hidden}
.quiz-qhdr{background:var(--bg3);padding:12px 16px;font-weight:600;font-size:.88rem;display:flex;gap:10px;align-items:flex-start;line-height:1.5}
.quiz-num-badge{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0;margin-top:1px}
.quiz-opts{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.quiz-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--rs);border:1px solid var(--border);cursor:pointer;transition:background var(--tr),border-color var(--tr);font-size:.875rem;color:var(--text);background:var(--bg2);text-align:left;font-family:var(--font);width:100%}
.quiz-opt:hover:not(:disabled){background:var(--bg3);border-color:var(--accent)}.quiz-opt:disabled{cursor:not-allowed}.quiz-opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.quiz-opt.correct{background:var(--success-bg);border-color:var(--success)}.quiz-opt.wrong{background:var(--error-bg);border-color:var(--error)}
.quiz-fb{padding:10px 16px;font-size:.85rem;display:none;border-top:1px solid var(--border);gap:8px;align-items:flex-start;line-height:1.5}
.quiz-fb.show{display:flex}.quiz-fb.correct{background:var(--success-bg);color:var(--success)}.quiz-fb.wrong{background:var(--error-bg);color:var(--error)}
.out-input{width:100%;background:var(--code-bg);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;font-family:var(--mono);font-size:.85rem;color:var(--code-text);margin:8px 0;resize:vertical}

/* try-it area */
.try-area{background:var(--code-bg);border-radius:var(--rs);overflow:hidden;margin:10px 0}
.try-hdr{padding:8px 14px;background:rgba(255,255,255,.05);font-size:.72rem;color:#94a3b8;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono)}
.try-textarea{width:100%;background:transparent;border:none;font-family:var(--mono);font-size:.84rem;color:var(--code-text);padding:14px;resize:vertical;outline:none;min-height:120px;line-height:1.85}
.try-btn-row{padding:8px 14px;background:rgba(255,255,255,.03);display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.06)}

/* countdown */
.btn-cd{opacity:.65;cursor:not-allowed!important}

/* hint, io grid, reveal */
.hint-box{background:var(--warn-bg);border-left:4px solid var(--warn);border-radius:0 var(--rs) var(--rs) 0;padding:10px 14px;font-size:.85rem;margin:10px 0;line-height:1.5}
.reveal-box{background:var(--bg3);border-radius:var(--rs);padding:12px;margin-top:10px;display:none}
.reveal-box.show{display:block}
.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.io-box{background:var(--code-bg);border-radius:var(--rs);padding:12px}
.io-lbl{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#64748b;margin-bottom:6px}
.io-box pre{font-family:var(--mono);font-size:.82rem;color:var(--code-text)}

/* module footer */
.mod-footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);gap:12px;flex-wrap:wrap}
.done-badge{display:inline-flex;align-items:center;gap:6px;background:var(--success-bg);color:var(--success);padding:6px 14px;border-radius:99px;font-size:.85rem;font-weight:600}

/* overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
.overlay.show{display:block}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}
  .main{margin-left:0}.btn-menu{display:flex}
  .mobile-mod-select{display:block}
  .anim-layout{grid-template-columns:1fr}.content{padding:20px 16px}
  .topbar{padding:10px 16px}.io-grid{grid-template-columns:1fr}
  .modules-grid{grid-template-columns:1fr}.mod-footer{flex-direction:column;align-items:stretch}
  .mod-footer .btn{justify-content:center}.exp-card{grid-template-columns:40px 1fr;gap:10px}
  .predict-card{padding:20px}
}
@media(max-width:420px){.home-h2{font-size:1.3rem}.vec-cell,.predict-mini-cell{width:38px;height:38px}}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}

    "kodeContoh": "#include <bits/stdc++.h>\nusing namespace std;\n\n// Fungsi rotasi matriks N x N sebesar 90 derajat searah jarum jam\nvoid rotateMatrix90(vector<vector<int>>& mat) {\n    int n = mat.size();\n\n    // Langkah 1: Transpose matriks (tukar mat[i][j] dengan mat[j][i])\n    for (int i = 0; i < n; i++) {\n        for (int j = i + 1; j < n; j++) {\n            // Memakai gelas ketiga / swap\n            swap(mat[i][j], mat[j][i]);\n        }\n    }\n\n    // Langkah 2: Balik (reverse) setiap baris secara horizontal\n    for (int i = 0; i < n; i++) {\n        reverse(mat[i].begin(), mat[i].end());\n    }\n}\n\nint main() {\n    ios::sync_with_stdio(0);\n    cin.tie(0);\n\n    int n;\n    if (cin >> n) {\n        vector<vector<int>> mat(n, vector<int>(n));\n        for (int i = 0; i < n; i++) {\n            for (int j = 0; j < n; j++) {\n                cin >> mat[i][j];\n            }\n        }\n\n        rotateMatrix90(mat);\n\n        // Cetak matriks hasil rotasi\n        for (int i = 0; i < n; i++) {\n            for (int j = 0; j < n; j++) {\n                cout << mat[i][j] << (j == n - 1 ? '\\n' : ' ');\n            }\n        }\n    }\n    return 0;\n}",

    "kodeContoh": "#include <bits/stdc++.h>\nusing namespace std;\n\nint main() {\n    ios::sync_with_stdio(0);\n    cin.tie(0);\n\n    vector<int> v = {38, 12, 85, 4, 19, 73};\n\n    // 1. Sort Standar (Kecil ke Besar)\n    sort(v.begin(), v.end());\n    // v = {4, 12, 19, 38, 73, 85}\n\n    // 2. Sort Terbalik (Besar ke Kecil)\n    sort(v.begin(), v.end(), greater<int>());\n    // v = {85, 73, 38, 19, 12, 4}\n\n    // 3. Sort Khusus Lambda: Ganjil di depan, Genap di belakang\n    // Jika sama-sama ganjil/genap, urutkan dari yang terkecil\n    sort(v.begin(), v.end(), [](int a, int b) {\n        bool aGanjil = (a % 2 != 0);\n        bool bGanjil = (b % 2 != 0);\n\n        if (aGanjil != bGanjil) {\n            return aGanjil; // yang ganjil (true) berada di depan\n        }\n        return a < b; // jika sama, angka lebih kecil di depan\n    });\n\n    for (int x : v) {\n        cout << x << \" \";\n    }\n    cout << '\\n';\n\n    return 0;\n}",

function saveProgress(){try{localStorage.setItem('cppcp_p',JSON.stringify(state.progress));}catch(e){}}

// THEME
// =====================================================================
function toggleTheme(){
  var n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  document.documentElement.setAttribute('data-theme',n);
  saveTheme(n); updateThemeBtns(n);
}
function updateThemeBtns(t){
  var icon=t==='dark'?'☀️':'🌙', lbl=t==='dark'?'Mode Terang':'Mode Gelap';
  ['themeBtn','themeBtn2'].forEach(function(id){var el=document.getElementById(id);if(el)el.innerHTML=icon+' '+lbl;});
}

// =====================================================================
// SIDEBAR & MOBILE NAVIGATION
// =====================================================================
function renderSidebar(){
  var done=MODULES.filter(function(m){return!m.comingSoon&&state.progress[m.id]==='done';}).length;
  var total=MODULES.filter(function(m){return!m.comingSoon;}).length;
  document.getElementById('progText').textContent=done+' / '+total+' selesai';
  document.getElementById('progFill').style.width=(total>0?Math.round(done/total*100):0)+'%';
  var html='';
  MODULES.forEach(function(m){
    var st=m.comingSoon?'soon':(state.progress[m.id]||'none');
    var isActive=!m.comingSoon&&state.moduleId===m.id;
    var ico=m.comingSoon?'🔒':(st==='done'?'✓':(st==='ongoing'?'▶':m.id));
    var sc=st==='done'?'s-done':(st==='ongoing'?'s-going':'s-none');
    html+='<button class="nav-btn'+(isActive?' active':'')+'"'
      +(m.comingSoon?' disabled aria-disabled="true"':' onclick="openModule('+m.id+')"')
      +' role="listitem" aria-label="'+esc(m.judul)+(m.comingSoon?' — segera hadir':'')+'">'
      +'<span class="nav-status '+sc+'" aria-hidden="true">'+ico+'</span>'
      +'<span>'+esc(m.judul)+'</span></button>';
  });
  document.getElementById('sidebarNav').innerHTML=html;

  var mobSel=document.getElementById('mobileModSelect');
  if(mobSel){
    if(state.page==='home')mobSel.value='home';
    else if(state.moduleId)mobSel.value=String(state.moduleId);
  }
}
function openSidebar(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function handleMobileSelect(val){
  if(val==='home')goHome();
  else openModule(Number(val));
}

// =====================================================================
// HOME
// =====================================================================
function renderHome(){
  var html='';
  MODULES.forEach(function(m){
    var st=m.comingSoon?'soon':(state.progress[m.id]||'none');
    var bt={done:'Selesai ✓',ongoing:'Sedang belajar',none:'Belum dimulai',soon:'Segera Hadir'}[st];
    var bc={done:'badge-done',ongoing:'badge-going',none:'badge-none',soon:'badge-soon'}[st];
    html+='<div class="m-card'+(m.comingSoon?' soon':'')+'"'
      +(m.comingSoon?'':' tabindex="0" onclick="openModule('+m.id+')" onkeydown="if(event.key===\'Enter\'||event.key===\' \')openModule('+m.id+')"')
      +' aria-label="'+esc(m.judul)+(m.comingSoon?' — segera hadir':'')+'">'
      +'<span class="badge '+bc+'">'+bt+'</span>'
      +'<div class="card-num">Modul '+m.id+'</div>'
      +'<div class="card-title">'+esc(m.judul)+'</div>'
      +'<div class="card-sum">'+esc(m.ringkasan)+'</div>'
      +'<div class="card-meta">⏱ '+esc(m.estimasi)+(m.tags?' · '+m.tags.join(', '):'')+' </div>'
      +'</div>';
  });
  document.getElementById('modulesGrid').innerHTML=html;
}

// =====================================================================
// MODULE PAGE
// =====================================================================
function openModule(id){
  closeSidebar();
  var m=MODULES.find(function(x){return x.id===id;});
  if(!m||m.comingSoon)return;
  stopAnim();
  state.anim.step=0;state.anim.playing=false;state.quiz={answered:{}};
  if(state.cdTimer){clearTimeout(state.cdTimer);state.cdTimer=null;}
  state.page='module';state.moduleId=id;
  if(!state.progress[id]||state.progress[id]==='none'){state.progress[id]='ongoing';saveProgress();}
  document.getElementById('homePage').style.display='none';
  var mp=document.getElementById('modulePage');
  mp.style.display='block';
  mp.innerHTML=buildModulePage(m);
  document.getElementById('topbarTitle').textContent=m.judul;
  renderSidebar();
  initSections(m);
  renderAnimStep();
  startCdTimer();
  window.scrollTo(0,0);
}

function goHome(){
  stopAnim();
  if(state.cdTimer){clearTimeout(state.cdTimer);state.cdTimer=null;}
  state.page='home';state.moduleId=null;
  document.getElementById('modulePage').style.display='none';
  document.getElementById('modulePage').innerHTML='';
  document.getElementById('homePage').style.display='block';
  document.getElementById('topbarTitle').textContent='Beranda';
  renderSidebar();renderHome();
}

function buildModulePage(m){
  var isDone=state.progress[m.id]==='done';
  state.sections={};
  SEC_ORDER.forEach(function(s){
    state.sections[s]=isDone?'done':(s==='analogi'?'active':'locked');
  });

  var html='<div style="margin-bottom:8px"><button class="btn btn-sm" onclick="goHome()" aria-label="Kembali ke beranda">← Beranda</button></div>';
  html+='<div style="margin-bottom:20px">';
  html+='<div style="font-size:.72rem;color:var(--text3);margin-bottom:4px">Modul '+m.id+' · ⏱ '+esc(m.estimasi)+'</div>';
  html+='<h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px">'+esc(m.judul)+'</h2>';
  html+='<p style="color:var(--text2)">'+esc(m.ringkasan)+'</p>';
  html+='</div>';
  html+=buildSecProgBar();
  html+=buildAnalogiSec(m);
  html+=buildPenjelasanSec(m);
  html+=buildAnimSec(m);
  html+=buildContohSec(m);
  html+=buildKesalahanSec(m);
  html+=buildLatihanSec(m);
  html+=buildModFooter(m);
  return html;
}

// ── Section progress bar ──
function buildSecProgBar(){
  var icons={analogi:'📖',penjelasan:'💡',animasi:'🎬',contoh:'📋',kesalahan:'⚠️',latihan:'📝'};
  var labels={analogi:'Analogi',penjelasan:'Penjelasan',animasi:'Animasi & Lab',contoh:'Kode',kesalahan:'Kesalahan',latihan:'Latihan'};
  var html='<div class="sec-prog-bar" id="secProgBar">';
  SEC_ORDER.forEach(function(s,i){
    html+='<div class="sp-pill" id="sp_'+s+'" onclick="jumpToSection(\''+s+'\')" title="Lompat ke '+labels[s]+'">'
      +icons[s]+' '+labels[s]+'</div>';
    if(i<SEC_ORDER.length-1)html+='<span class="sp-arrow">›</span>';
  });
  html+='</div>';
  return html;
}

function jumpToSection(name){
  if(state.sections[name]==='locked'){
    alert('Bagian ini masih terkunci. Selesaikan bagian sebelumnya terlebih dahulu!');
    return;
  }
  var el=document.getElementById('sec_'+name);
  if(el){el.scrollIntoView({behavior:'smooth',block:'start'});}
}

function formatAnalogiText(text) {
  var pars = text.split('\n\n');
  var out = '';
  pars.forEach(function(p) {
    p = p.trim();
    if (!p) return;
    var numMatch = p.match(/^(\d+)\.\s*([\s\S]*)/);
    if (numMatch) {
      var itemNum = numMatch[1];
      var itemBody = numMatch[2];
      var colonIdx = itemBody.indexOf(':');
      if (colonIdx !== -1) {
        var heading = itemBody.slice(0, colonIdx).trim();
        var desc = itemBody.slice(colonIdx + 1).trim();
        out += '<div style="margin-top:10px;padding:10px 14px;background:var(--bg2);border-radius:var(--rs);border-left:3px solid var(--accent);font-size:.86rem;line-height:1.6;">'
          + '<strong style="color:var(--accent);">' + itemNum + '. ' + esc(heading) + ':</strong> '
          + esc(desc)
          + '</div>';
        return;
      }
    }
    out += '<p style="margin-bottom:8px;line-height:1.7;">' + esc(p) + '</p>';
  });
  return out;
}

function initSections(m){
  SEC_ORDER.forEach(function(s){
    var el=document.getElementById('sec_'+s);
    if(el)el.className='sec '+(state.sections[s]||'locked');
    var icon=document.getElementById('si_'+s);
    if(icon){
      if(state.sections[s]==='done')icon.textContent='✅';
      else icon.textContent='';
    }
  });
  updateSecProgBar();
  renderSandbox(); if(state.moduleId===3) renderSandboxMatrix(); if(state.moduleId===4) renderSortVisual(); if(state.moduleId===5) renderPairVisual(); if(state.moduleId===6) renderMapSetVisual(); if(state.moduleId===7) renderSb7(); if(state.moduleId===8) renderSb8();
}

function completeSection(name){
  if(state.sections[name]==='done')return;
  state.sections[name]='done';
  var el=document.getElementById('sec_'+name);
  if(el)el.className='sec done';
  var icon=document.getElementById('si_'+name);
  if(icon)icon.textContent='✅';
  var idx=SEC_ORDER.indexOf(name);
  if(idx<SEC_ORDER.length-1){
    var next=SEC_ORDER[idx+1];
    if(state.sections[next]==='locked')unlockSection(next);
  }
  updateSecProgBar();
}

function unlockSection(name){
  if(state.sections[name]!=='locked')return;
  state.sections[name]='active';
  var el=document.getElementById('sec_'+name);
  if(el){
    el.className='sec active revealing';
    setTimeout(function(){el.classList.remove('revealing');},500);
    setTimeout(function(){el.scrollIntoView({behavior:'smooth',block:'start'});},100);
  }
  updateSecProgBar();
}

function updateSecProgBar(){
  SEC_ORDER.forEach(function(s){
    var pill=document.getElementById('sp_'+s);
    if(!pill)return;
    var st=state.sections[s]||'locked';
    pill.className='sp-pill'+(st==='active'?' active':(st==='done'?' done':''));
  });
}

// =====================================================================
// COUNTDOWN TIMER (for reveal button)
// =====================================================================
function startCdTimer(){
  var btn=document.getElementById('revealBtn');
  if(!btn)return;
  var count=5;
  function tick(){
    var b=document.getElementById('revealBtn');
    if(!b)return;
    if(count<=0){b.disabled=false;b.classList.remove('btn-cd');b.textContent='👁 Lihat Kunci Jawaban';return;}
    b.textContent='⏳ Kunci Jawaban ('+count+'s)';
    count--;
    state.cdTimer=setTimeout(tick,1000);
  }
  tick();
}

// =====================================================================
// ANIMATION ENGINE
// =====================================================================
function getModule(){return MODULES.find(function(m){return m.id===state.moduleId;});}

function countRealSteps(){
  var m=getModule();
  if(!m)return 0;
  return m.animasi.steps.filter(function(s){return !s.type;}).length;
}

function realStepIndex(){
  var m=getModule();
  if(!m)return 1;
  var count=0;
  for(var i=0;i<=state.anim.step&&i<m.animasi.steps.length;i++){
    if(!m.animasi.steps[i].type)count++;
  }
  return count;
}

function renderAnimStep(){
  var m=getModule();if(!m||!m.animasi)return;
  var step=m.animasi.steps[state.anim.step];if(!step)return;

  if(step.type==='predict'){
    showPredict(step);
    return;
  }

  var total=countRealSteps();
  var idx=realStepIndex();

  // Clear code line highlights
  document.querySelectorAll('.code-line').forEach(function(el){el.classList.remove('hi');});
  var firstEl=null;
  (step.lines||[]).forEach(function(ln){
    var el=document.getElementById('cl_'+ln);
    if(el){el.classList.add('hi');if(!firstEl)firstEl=el;}
  });
  if(firstEl)firstEl.scrollIntoView({block:'nearest',behavior:'smooth'});

  // Visual stage per module
  var vv=document.getElementById('vecVis');
  if(vv){
    if(m.id === 2){
      // Modul 2: Pipa I/O & Buffer
      var ioHtml='<div style="display:flex;flex-direction:column;gap:8px;width:100%;font-size:.82rem;">';

        + '<span class="vec-cell hl" style="width:auto;height:30px;padding:2px 10px;font-size:.78rem;">' + (step.vars["Sync C/C++"] || "Turbo Standby") + '</span>'
        + (step.vars["cin.tie"] ? '<span class="vec-cell hl" style="width:auto;height:30px;padding:2px 10px;font-size:.78rem;">cin.tie: NULL</span>' : '')
        + '</div>';
      ioHtml+='<div style="display:flex;align-items:center;gap:10px;">'
        + '<span style="font-weight:700;color:var(--success);min-width:110px;">Buffer Output:</span>'
        + '<div class="vec-cell" style="width:auto;min-width:160px;height:34px;padding:2px 12px;font-size:.82rem;font-family:var(--mono);">'
        + (step.info && step.info.includes("Buffer Output") ? step.info.replace("Buffer Output: ", "") : (step.info || "Buffer siap menampung"))
        + '</div>'
        + '</div>';
      ioHtml+='</div>';
      vv.innerHTML=ioHtml;
    } else if(step.grid){
      // Modul 3: Grid Matriks 2D
      var ghtml='<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;">';

        ghtml+='<div style="display:flex;gap:6px;align-items:center;">';

        step.pq.forEach(function(item, idx){
          var isTop = idx === 0;
          qHtml += '<span class="vec-cell ' + (item.hl ? 'hl new' : '') + '" style="width:auto;height:28px;padding:1px 7px;font-size:.76rem;' + (isTop ? 'border-color:var(--warn);font-weight:700;' : '') + '">' 
            + (isTop ? '👑 ' : '') + item.v + '</span>';
        });
      }
      qHtml += '</div><div style="font-size:.65rem;color:var(--text3);margin-top:4px;">top (max): ' + (step.pq && step.pq.length > 0 ? step.pq[0].v : '-') + '</div></div>';

      qHtml += '</div>';
      vv.innerHTML = qHtml;
    } else if(m.id === 8){
      // Modul 8: Visual Generic Template Instantiation
      var tHtml='<div style="display:flex;flex-direction:column;gap:8px;width:100%;font-size:.8rem;">';
      
      tHtml+='<div style="display:flex;align-items:center;gap:10px;">'
        + '<span style="font-weight:700;color:var(--accent);min-width:130px;">Cetakan Template:</span>'
        + '<span class="vec-cell hl" style="width:auto;height:30px;padding:2px 10px;font-family:var(--mono);font-size:.78rem;">template&lt;typename T&gt; cetakDuaKali(T x)</span>'
        + '</div>';

      tHtml+='<div style="display:flex;align-items:center;gap:10px;">'
        + '<span style="font-weight:700;color:var(--success);min-width:130px;">Tipe T Terpilih:</span>'
        + '<span class="vec-cell" style="width:auto;min-width:80px;height:30px;padding:2px 10px;font-family:var(--mono);font-size:.8rem;border-color:var(--success);">'
        + '<strong style="color:var(--success);">' + (step.vars["T Terdeteksi"] || "T (Fleksibel)") + '</strong>'
        + '</span>'
        + '</div>';

      tHtml+='<div style="display:flex;align-items:center;gap:10px;">'
        + '<span style="font-weight:700;color:var(--warn);min-width:130px;">Output Instansiasi:</span>'
        + '<div class="vec-cell" style="width:auto;min-width:160px;height:34px;padding:2px 12px;font-size:.82rem;font-family:var(--mono);">'
        + (step.vars["Output"] ? 'Hasil: ' + step.vars["Output"] : (step.info || "Menunggu pemanggilan fungsi"))
        + '</div>'
        + '</div>';

      tHtml+='</div>';
      vv.innerHTML=tHtml;
    } else if(!step.vec||step.vec.length===0){
      vv.innerHTML='<span class="empty-hint">data kosong</span>';
    } else {
      var vhtml='';
      step.vec.forEach(function(item,i){
        vhtml+='<div class="vec-slot'+(item.hl?' ptr-active':'')+'">'
          +'<div class="slot-ptr">▼</div>'
          +'<div class="vec-cell'+(item.hl?' hl':'')+(item.isNew?' new':'')+'">'+item.v+'</div>'
          +'<div class="vec-idx">['+i+']</div>'
          +'</div>';
      });
      vv.innerHTML=vhtml;
    }
  }

  // Variables visual
  var varsEl=document.getElementById('varsVis');
  if(varsEl){
    var vkeys=Object.keys(step.vars||{});
    if(vkeys.length===0){varsEl.innerHTML='<span class="empty-hint">—</span>';}
    else{varsEl.innerHTML=vkeys.map(function(k){return'<div class="var-box"><div class="var-lbl">'+esc(k)+'</div><div class="var-val">'+esc(String(step.vars[k]))+'</div></div>';}).join('');}
  }

  var li=document.getElementById('loopInfo');if(li)li.textContent=step.info||'';

  // Step Counter
  var sc=document.getElementById('stepCtr'),ap=document.getElementById('animProg');
  if(sc)sc.textContent='Langkah '+idx+' / '+total;
  if(ap)ap.textContent='Langkah '+idx+' / '+total;

  // Typewriter description
  typewriterDesc(document.getElementById('stepDesc'),step.desc);

  // Control Buttons
  var prev=document.getElementById('animPrevBtn'),next=document.getElementById('animNextBtn');
  if(prev)prev.disabled=(state.anim.step===0);
  if(next)next.disabled=(state.anim.step===m.animasi.steps.length-1);
}

function typewriterDesc(el,text){
  if(!el||!text)return;
  var prefersReduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(prefersReduced){el.textContent=text;return;}
  var gen=++state.anim.twGen;
  el.innerHTML='';
  var cursor=document.createElement('span');
  cursor.className='tw-cursor';
  el.appendChild(cursor);
  var words=text.split(' ');
  words.forEach(function(word,i){
    var span=document.createElement('span');
    span.style.cssText='opacity:0;transition:opacity .18s ease;display:inline';
    span.textContent=(i===0?'':' ')+word;
    el.insertBefore(span,cursor);
    setTimeout(function(){
      if(state.anim.twGen!==gen)return;
      span.style.opacity='1';
      if(i===words.length-1){cursor.remove();}
    },i*45);
  });
}

function animToggle(){if(state.anim.playing)animPause();else animPlay();}

function animPlay(){
  state.anim.playing=true;
  var btn=document.getElementById('animPlayBtn');if(btn)btn.innerHTML='⏸ Pause';
  animSchedule();
}

function animPause(){
  state.anim.playing=false;
  var btn=document.getElementById('animPlayBtn');if(btn)btn.innerHTML='▶ Play';
  if(state.anim.timer){clearTimeout(state.anim.timer);state.anim.timer=null;}
}

function stopAnim(){
  state.anim.playing=false;
  if(state.anim.timer){clearTimeout(state.anim.timer);state.anim.timer=null;}
}

function animSchedule(){
  if(!state.anim.playing)return;
  state.anim.timer=setTimeout(function(){
    var m=getModule();if(!m)return;
    if(state.anim.step<m.animasi.steps.length-1){
      state.anim.step++;
      var step=m.animasi.steps[state.anim.step];
      if(step.type==='predict'){
        animPause();
        state.anim.wasPlaying=true;
        renderAnimStepVisuals(step);
        showPredict(step);
      } else {
        renderAnimStep();
        animSchedule();
      }
    } else {
      animPause();
      completeSection('animasi');
    }
  },state.anim.speed);
}

function animNext(){
  var m=getModule();if(!m)return;
  if(state.anim.step>=m.animasi.steps.length-1)return;
  state.anim.step++;
  var step=m.animasi.steps[state.anim.step];
  if(step.type==='predict'){
    state.anim.wasPlaying=false;
    renderAnimStepVisuals(step);
    showPredict(step);
  } else {
    renderAnimStep();
  }
}

function animPrev(){
  if(state.anim.step<=0)return;
  state.anim.step--;
  var m=getModule();
  while(state.anim.step>0&&m&&m.animasi.steps[state.anim.step]&&m.animasi.steps[state.anim.step].type){
    state.anim.step--;
  }
  renderAnimStep();
}

function animReset(){
  stopAnim();state.anim.step=0;
  renderAnimStep();
  var btn=document.getElementById('animPlayBtn');if(btn)btn.innerHTML='▶ Play';
}

function animSetSpeed(val){
  val=parseInt(val);
  var sp={1:2200,2:1600,3:1100,4:600,5:320};
  var lb={1:'Pelan',2:'Lambat',3:'Normal',4:'Cepat',5:'Super cepat'};
  state.anim.speed=sp[val]||1100;
  var lbl=document.getElementById('speedLbl');if(lbl)lbl.textContent=lb[val]||'Normal';
}

function renderAnimStepVisuals(step){
  var vv=document.getElementById('vecVis');
  if(vv){
    if(!step.vec||step.vec.length===0){vv.innerHTML='<span class="empty-hint">kosong</span>';}
    else{
      var vhtml='';
      step.vec.forEach(function(item,i){
        vhtml+='<div class="vec-slot">'
          +'<div class="slot-ptr"></div>'
          +'<div class="vec-cell">'+item.v+'</div>'
          +'<div class="vec-idx">['+i+']</div>'
          +'</div>';
      });
      vv.innerHTML=vhtml;
    }
  }
  var li=document.getElementById('loopInfo');if(li)li.textContent=step.info||'';
}

function sandboxPush(){
  var inp=document.getElementById('sbInput');
  var val=inp&&inp.value!==''?parseInt(inp.value):Math.floor(Math.random()*90+10);
  if(isNaN(val))val=42;
  if(sbVector.length>=10){
    alert('Rak simulasi dibatasi 10 elemen agar pas di layar. Silakan coba pop_back() atau clear() dulu.');
    return;
  }
  sbVector.push(val);
  renderSandbox();
  var log=document.getElementById('sbCodeLog');
  if(log)log.innerHTML='<span class="fn">v.push_back</span>(<span class="nm">'+val+'</span>); <span class="cm">// nilai '+val+' masuk di indeks ['+(sbVector.length-1)+']</span>';
  if(inp)inp.value=Math.floor(Math.random()*90+10);
}

function sandboxPop(){
  var log=document.getElementById('sbCodeLog');
  if(sbVector.length===0){
    if(log)log.innerHTML='<span class="cm">// ⚠️ Peringatan: v sudah kosong! Di C++, pop_back() saat size 0 menyebabkan Undefined Behavior!</span>';
    return;
  }
  var popped=sbVector.pop();
  renderSandbox();
  if(log)log.innerHTML='<span class="fn">v.pop_back</span>(); <span class="cm">// nilai '+popped+' dihapus dari belakang, sisa size = '+sbVector.length+'</span>';
}

function sandboxClear(){
  sbVector=[];
  renderSandbox();
  var log=document.getElementById('sbCodeLog');
  if(log)log.innerHTML='<span class="fn">v.clear</span>(); <span class="cm">// seluruh elemen dihapus, rak kosong kembali (size = 0)</span>';
}

function renderSandbox(){
  var vis=document.getElementById('sbVis');
  var sz=document.getElementById('sbSize');
  var back=document.getElementById('sbBack');
  if(sz)sz.textContent='v.size() = '+sbVector.length;
  if(back)back.textContent=sbVector.length>0?'v.back() = '+sbVector[sbVector.length-1]:'—';
  if(!vis)return;
  if(sbVector.length===0){
    vis.innerHTML='<span class="empty-hint">vector kosong, coba push_back angka di atas!</span>';
    return;
  }
  var html='';
  sbVector.forEach(function(item,i){
    var isLast=i===sbVector.length-1;
    html+='<div class="vec-slot '+(isLast?'ptr-active':'')+'">'
      +'<div class="slot-ptr">'+(isLast?'▼ back()':'&nbsp;')+'</div>'
      +'<div class="vec-cell '+(isLast?'hl new':'')+'">'+item+'</div>'
      +'<div class="vec-idx">['+i+']</div>'
      +'</div>';
  });
  vis.innerHTML=html;
}

function answerPredict(optIdx){
  var m=getModule();if(!m)return;
  var step=m.animasi.steps[state.anim.step];if(!step)return;

  document.querySelectorAll('.predict-opt').forEach(function(btn,i){
    btn.disabled=true;
    if(step.options[i].correct)btn.classList.add('p-correct');
    else if(i===optIdx&&!step.options[i].correct)btn.classList.add('p-wrong');
  });

  var isOk=step.options[optIdx].correct;
  var fb=document.getElementById('predictFb');
  if(fb){
    fb.innerHTML='<div class="predict-fb '+(isOk?'correct':'wrong')+'">'
      +'<span style="font-size:1.2rem;flex-shrink:0">'+(isOk?'✅':'❌')+'</span>'
      +'<span>'+(isOk?'<strong>Tepat Sekali!</strong>':'<strong>Kurang Pas.</strong>')+' '+esc(isOk?step.correctFeedback:step.wrongFeedback)+'</span>'
      +'</div>';
  }
  var cw=document.getElementById('predictContinueWrap');
  if(cw){
    cw.innerHTML='<button class="btn btn-primary btn-sm" onclick="skipPredict()" aria-label="Lanjut animasi">Lanjut Animasi →</button>';
  }
  var skip=document.querySelector('.predict-skip');
  if(skip)skip.style.display='none';
}

function skipPredict(){
  var overlay=document.getElementById('predictOverlay');
  if(overlay)overlay.classList.remove('show');
  state.predict.active=false;
  if(state.anim.wasPlaying){state.anim.wasPlaying=false;animPlay();}
}

function answerQ(qi,oi){
  if(state.quiz.answered['q'+qi]!==undefined)return;
  state.quiz.answered['q'+qi]=oi;
  var m=getModule();if(!m)return;
  var q=m.latihan.pilgan[qi];
  var isOk=oi===q.jawaban;
  q.opsi.forEach(function(_,o){
    var btn=document.getElementById('qo_'+qi+'_'+o);if(!btn)return;
    btn.disabled=true;
    if(o===q.jawaban)btn.classList.add('correct');
    else if(o===oi&&!isOk)btn.classList.add('wrong');
  });
  var fb=document.getElementById('qfb_'+qi);
  if(fb){
    fb.className='quiz-fb show '+(isOk?'correct':'wrong');
    fb.innerHTML='<span style="font-size:1.1rem;flex-shrink:0">'+(isOk?'✅':'❌')+'</span>'
      +'<span>'+(isOk?'<strong>Benar!</strong>':'<strong>Kurang tepat.</strong>')+' '+esc(q.alasan)+'</span>';
  }
}

function checkOutput(){
  var m=getModule();if(!m)return;
  var inp=document.getElementById('outGuess'),fb=document.getElementById('outFb');if(!inp||!fb)return;
  // normalize: allow comma, multispaces, newlines
  var user=inp.value.trim().replace(/,/g,' ').replace(/\s+/g,' ');
  var correct=m.latihan.outputSoal.jawaban.trim().replace(/,/g,' ').replace(/\s+/g,' ');
  var isOk=user===correct;
  fb.className='quiz-fb show '+(isOk?'correct':'wrong');
  fb.innerHTML='<span style="font-size:1.1rem;flex-shrink:0">'+(isOk?'✅':'❌')+'</span>'
    +'<span>'+(isOk?'<strong>Tepat sekali!</strong>':'Jawaban yang benar: <code class="il">'+esc(correct)+'</code>')+' — '+esc(m.latihan.outputSoal.penjelasan)+'</span>';
}

function runBenchmark(mode){
  var slowFill = document.getElementById('benchSlowFill');
  var fastFill = document.getElementById('benchFastFill');
  var slowTime = document.getElementById('benchSlowTime');
  var fastTime = document.getElementById('benchFastTime');
  var verdict = document.getElementById('benchVerdict');
  var btnSlow = document.getElementById('btnBenchSlow');
  var btnFast = document.getElementById('btnBenchFast');

  if(mode === 'slow'){
    if(btnSlow) btnSlow.disabled = true;
    if(slowFill) { slowFill.style.transition = 'width 2.2s ease-in-out'; slowFill.style.width = '100%'; }
    if(slowTime) slowTime.textContent = 'Menjalankan loop 100.000 x endl... (flush berulang)';
    setTimeout(function(){
      if(slowTime) slowTime.innerHTML = '<span style="color:var(--error);font-weight:700">2.15 detik ❌ TLE (Time Limit Exceeded)</span>';
      if(verdict) verdict.innerHTML = '<span style="color:var(--error)">❌ Programmu dihentikan juri karena melebihi batas 1.00 detik! Setiap endl memaksa sistem operasi mengosongkan buffer ke console sebanyak 100.000 kali.</span>';
      if(btnSlow) btnSlow.disabled = false;
    }, 2200);
  } else {
    if(btnFast) btnFast.disabled = true;
    if(fastFill) { fastFill.style.transition = 'width 0.15s ease-out'; fastFill.style.width = '100%'; }
    if(fastTime) fastTime.textContent = 'Mengirim data ke buffer kontainer...';
    setTimeout(function(){
      if(fastTime) fastTime.innerHTML = '<span style="color:var(--success);font-weight:700">0.04 detik ✅ ACCEPTED</span>';
      if(verdict) verdict.innerHTML = '<span style="color:var(--success)">✅ Lolos kilat! Dengan ios::sync_with_stdio(0) dan \'\\n\', waktu pemrosesan turun 50x lipat lebih cepat (hanya 0.04 detik)!</span>';
      if(btnFast) btnFast.disabled = false;
    }, 200);
  }
}

var sbMatrix = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];

function renderSandboxMatrix(highlightCoords) {
  var gridEl = document.getElementById('sbMatrixGrid');
  if (!gridEl) return;
  var html = '';
  sbMatrix.forEach(function(row, r) {
    html += '<div style="display:flex;gap:6px;align-items:center;">';
    html += '<span style="font-size:.65rem;color:var(--text3);font-family:var(--mono);width:16px;">r' + r + '</span>';
    row.forEach(function(val, c) {
      var isHl = highlightCoords && highlightCoords.some(function(h) { return h[0] === r && h[1] === c; });
      html += '<div class="vec-cell ' + (isHl ? 'hl new' : '') + '" style="width:40px;height:40px;font-size:.85rem;" title="mat[' + r + '][' + c + '] = ' + val + '">' + val + '</div>';
    });
    html += '</div>';
  });
  gridEl.innerHTML = html;
}

function rotateSandboxMatrix() {
  var n = sbMatrix.length;
  // Transpose
  for (var i = 0; i < n; i++) {
    for (var j = i + 1; j < n; j++) {
      var t = sbMatrix[i][j];
      sbMatrix[i][j] = sbMatrix[j][i];
      sbMatrix[j][i] = t;
    }
  }
  // Reverse each row
  for (var i = 0; i < n; i++) {
    sbMatrix[i].reverse();
  }
  renderSandboxMatrix();
  var log = document.getElementById('sbMatrixLog');
  if (log) log.innerHTML = '<span class="fn">rotateMatrix90</span>(mat); <span class="cm">// 1. Transpose -> 2. Reverse tiap baris -> Sukses putar 90°!</span>';
  var status = document.getElementById('sbMatrixStatus');
  if (status) status.innerHTML = '🔄 <strong>Matriks Berputar 90°!</strong> Perhatikan angka 1, 2, 3 di baris paling atas sekarang berpindah tegak ke kolom paling kanan.';
  var cup = document.getElementById('sbTempCup');
  if (cup) cup.textContent = 'temp: — (selesai)';
}

function simulateSwapWithTemp() {
  var valA = sbMatrix[0][1]; // 2
  var valB = sbMatrix[1][0]; // 4
  var cup = document.getElementById('sbTempCup');
  if (cup) cup.innerHTML = 'temp = mat[0][1] <span style="color:var(--text)">(' + valA + ')</span> 🥛';
  
  var t = sbMatrix[0][1];
  sbMatrix[0][1] = sbMatrix[1][0];
  sbMatrix[1][0] = t;

  renderSandboxMatrix([[0, 1], [1, 0]]);
  var log = document.getElementById('sbMatrixLog');
  if (log) log.innerHTML = '<span class="ty">int</span> temp = mat[0][1]; mat[0][1] = mat[1][0]; mat[1][0] = temp; <span class="cm">// Nilai tertukar bersih!</span>';
  var status = document.getElementById('sbMatrixStatus');
  if (status) status.innerHTML = '✅ <strong>Swap Sukses!</strong> Nilai ' + valA + ' diamankan di gelas ketiga (temp), sehingga saat mat[0][1] ditimpa ' + valB + ', nilai ' + valA + ' tetap selamat dan dipindahkan ke mat[1][0].';
}

function simulateSwapWithoutTemp() {
  var valA = sbMatrix[0][1];
  var valB = sbMatrix[1][0];
  
  // Directly overwrite without temp:
  sbMatrix[0][1] = sbMatrix[1][0];
  sbMatrix[1][0] = sbMatrix[0][1]; // now both are valB!

  renderSandboxMatrix([[0, 1], [1, 0]]);
  var cup = document.getElementById('sbTempCup');
  if (cup) cup.innerHTML = '<span style="color:var(--error)">temp: TIDAK DIPAKAI ❌</span>';
  var log = document.getElementById('sbMatrixLog');
  if (log) log.innerHTML = 'mat[0][1] = mat[1][0]; mat[1][0] = mat[0][1]; <span class="cm">// ❌ ERROR LOGIKA: Nilai asli ' + valA + ' HILANG!</span>';
  var status = document.getElementById('sbMatrixStatus');
  if (status) status.innerHTML = '❌ <strong>DATA RUSAK!</strong> Karena tidak memakai temp, nilai ' + valA + ' langsung musnah tertimpa angka ' + valB + '. Akibatnya kedua petak sekarang menjadi angka ' + valB + '!';
}

function resetSandboxMatrix() {
  sbMatrix = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
  renderSandboxMatrix();
  var log = document.getElementById('sbMatrixLog');
  if (log) log.innerHTML = '<span class="cm">// Matriks dikembalikan ke posisi semula [[1,2,3],[4,5,6],[7,8,9]]</span>';
  var status = document.getElementById('sbMatrixStatus');
  if (status) status.textContent = 'Matriks di-reset. Coba tombol putar atau simulasi swap!';
  var cup = document.getElementById('sbTempCup');
  if (cup) cup.textContent = 'temp: kosong (—)';
}

function sortSandboxAsc() {
  sbSortArr.sort(function(a, b) { return a - b; });

  var log = document.getElementById('sbSortLog');

function sortSandboxDesc() {
  sbSortArr.sort(function(a, b) { return b - a; });
  renderSortVisual([0, 1, 2, 3, 4, 5]);

  if (log) log.innerHTML = '<span class="fn">sort</span>(v.<span class="fn">begin</span>(), v.<span class="fn">end</span>(), [](<span class="ty">int</span> a, <span class="ty">int</span> b){ <span class="kw">return</span> a &gt; b; });';

function sortSandboxOddEven() {
  sbSortArr.sort(function(a, b) {
    var aOdd = (a % 2 !== 0);
    var bOdd = (b % 2 !== 0);
    if (aOdd !== bOdd) return aOdd ? -1 : 1; // ganjil di depan
    return a - b; // jika sama-sama ganjil/genap, urutkan kecil ke besar
  });
  renderSortVisual([0, 1, 2, 3, 4, 5]);
  var log = document.getElementById('sbSortLog');
  if (log) log.innerHTML = '<span class="fn">sort</span>(v.<span class="fn">begin</span>(), v.<span class="fn">end</span>(), [](<span class="ty">int</span> a, <span class="ty">int</span> b){ <span class="kw">if</span>((a%2!=0)!=(b%2!=0)) <span class="kw">return</span> a%2!=0; <span class="kw">return</span> a&lt;b; });';
  var st = document.getElementById('sbSortStatus');
  if (st) st.innerHTML = '⚡ <strong>Custom Lambda Sukses:</strong> Semua angka GANJIL (19, 73, 85) dikumpulkan di depan, disusul semua angka GENAP (4, 12, 38) di belakang!';

function sortPairDefault() {
  sbPairData.sort(function(a, b) {

function sortPairDesc() {

function renderMapSetVisual(highlightKey) {
  var setVis = document.getElementById('sbSetVisual');

  var mapCount = document.getElementById('sbMapCount');

  if (setVis) {

      });

    if (keys.length === 0) {

      var mHtml = '';
      keys.forEach(function(k) {

        mHtml += '<div class="vec-cell ' + (isHl ? 'hl new' : '') + '" style="width:auto;height:36px;padding:2px 10px;font-size:.82rem;border-color:var(--success);color:var(--text);" title="' + k + ' : ' + sbMapData[k] + '">'

  if (mapCount) mapCount.textContent = 'frek.size() = ' + Object.keys(sbMapData).length + ' kata kunci';
}

function addMapSetItem() {
  var inp = document.getElementById('sbMapInput');
  var key = inp && inp.value.trim() ? inp.value.trim() : 'apel';
  var isDuplicate = sbSetData.indexOf(key) !== -1;

  if (!isDuplicate) {
    sbSetData.push(key);
    sbSetData.sort(); // set always sorted
  }

  if (!sbMapData[key]) sbMapData[key] = 0;
  sbMapData[key]++;

  renderMapSetVisual(key);

  var log = document.getElementById('sbMapLog');
  if (log) log.innerHTML = 's.<span class="fn">insert</span>(<span class="st">"' + key + '"</span>); frek[<span class="st">"' + key + '"</span>]++;';

  var st = document.getElementById('sbMapStatus');
  if (st) {
    if (isDuplicate) {
      st.innerHTML = '🛡️ <strong>Duplikat Ditolak pada Set!</strong> Kata <code class="il">"' + key + '"</code> sudah ada di <code class="il">set</code> sehingga tidak ditambah lagi. Namun pada <code class="il">map</code>, frekuensinya naik menjadi <strong>' + sbMapData[key] + '</strong>!';
    } else {
      st.innerHTML = '✨ <strong>Data Baru Dimasukkan:</strong> Kata <code class="il">"' + key + '"</code> masuk ke dalam <code class="il">set</code> (otomatis diurutkan) dan frekuensinya di <code class="il">map</code> bernilai <strong>1</strong>.';
    }
  }
}

function checkMapSetItem() {
  var inp = document.getElementById('sbMapInput');
  var key = inp && inp.value.trim() ? inp.value.trim() : 'apel';
  var exists = sbSetData.indexOf(key) !== -1;

  renderMapSetVisual(exists ? key : null);

  var log = document.getElementById('sbMapLog');
  if (log) log.innerHTML = '<span class="ty">int</span> ada = s.<span class="fn">count</span>(<span class="st">"' + key + '"</span>); <span class="cm">// Mengembalikan ' + (exists ? 1 : 0) + ' tanpa membuat key baru</span>';

  var st = document.getElementById('sbMapStatus');
  if (st) {
    if (exists) {
      st.innerHTML = '🔍 <strong>Ditemukan!</strong> <code class="il">s.count("' + key + '") == 1</code>. Kata ini ada di set, dan di map frekuensinya tercatat sebanyak <strong>' + sbMapData[key] + ' kali</strong>.';
    } else {
      st.innerHTML = '❌ <strong>Tidak Ada:</strong> <code class="il">s.count("' + key + '") == 0</code>. Perhatikan bahwa fungsi <code class="il">.count()</code> memeriksa data secara aman tanpa membuat entri sampah di map!';
    }
  }
}

function eraseMapSetItem() {
  var inp = document.getElementById('sbMapInput');
  var key = inp && inp.value.trim() ? inp.value.trim() : 'apel';
  var idx = sbSetData.indexOf(key);

  if (idx !== -1) {
    sbSetData.splice(idx, 1);
    delete sbMapData[key];
    renderMapSetVisual();
    var log = document.getElementById('sbMapLog');
    if (log) log.innerHTML = 's.<span class="fn">erase</span>(<span class="st">"' + key + '"</span>); frek.<span class="fn">erase</span>(<span class="st">"' + key + '"</span>); <span class="cm">// Dihapus dalam O(log N)</span>';
    var st = document.getElementById('sbMapStatus');
    if (st) st.innerHTML = '🗑️ <strong>Dihapus!</strong> Kata <code class="il">"' + key + '"</code> telah dibersihkan dari set dan map.';
  } else {
    var st = document.getElementById('sbMapStatus');
    if (st) st.innerHTML = '⚠️ Kata <code class="il">"' + key + '"</code> tidak ada di dalam data, tidak ada yang dihapus.';
  }
}

function checkMiniCoding(){
  var m = getModule();
  if(!m) return;
  var ta = document.getElementById('tryTextarea');
  var fb = document.getElementById('miniCodingFb');
  if(!ta || !fb) return;
  var code = ta.value;

  fb.style.display = 'block';

  if (m.id === 1) {
    var hasVector=/vector\s*<\s*int\s*>/i.test(code)||/vector/i.test(code);
    var hasCin=/cin\s*>>/i.test(code);
    var hasCout=/cout\s*<</i.test(code);
    var hasReverseOrLoop=/reverse\s*\(/i.test(code)||/for\s*\(.*--;?.*\)/i.test(code)||/i\s*--/i.test(code)||/n\s*-\s*1/i.test(code);

    if(hasVector&&hasCin&&hasCout&&hasReverseOrLoop){
      fb.className='quiz-fb show correct';
      fb.innerHTML='<span style="font-size:1.2rem">🌟</span> <span><strong>Mantap sekali!</strong> Kodinganmu sudah mendeklarasikan vector, membaca input nilai, dan membalik urutannya. Bandingkan dengan jawaban referensi di bawah untuk melihat sintaks lengkapnya.</span>';
    } else if(!hasVector){
      fb.className='quiz-fb show wrong';
      fb.innerHTML='<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Kamu belum membuat vector. Coba tulis <code class="il">vector&lt;int&gt; v(n);</code> untuk menampung n angka tersebut.</span>';
    } else if(!hasCin||!hasCout){
      fb.className='quiz-fb show wrong';
      fb.innerHTML='<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Jangan lupa membaca input angka dengan <code class="il">cin &gt;&gt;</code> dan menampilkan hasil akhir dengan <code class="il">cout &lt;&lt;</code>.</span>';
    } else if(!hasReverseOrLoop){
      fb.className='quiz-fb show wrong';
      fb.innerHTML='<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Untuk mencetak terbalik, jalankan loop mundur dari indeks <code class="il">n-1</code> sampai <code class="il">0</code> dengan <code class="il">i--</code>, atau panggil fungsi <code class="il">reverse(v.begin(), v.end())</code>.</span>';
    } else {
      fb.className='quiz-fb show correct';
      fb.innerHTML='<span style="font-size:1.2rem">👍</span> <span>Struktur kode sudah bagus! Silakan bandingkan dengan kunci jawaban.</span>';
    }
  } else if (m.id === 2) {
    var hasFastIO = /sync_with_stdio/i.test(code);
    var hasCinTie = /cin\.tie/i.test(code);
    var hasEndl = /endl/i.test(code);
    var hasSlashN = /'\\n'/i.test(code) || /"\\n"/i.test(code);

    if (hasEndl) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">⚠️</span> <span><strong>Hindari endl!</strong> Terdeteksi penggunaan <code class="il">endl</code>. Ingat, di soal dengan input ratusan ribu angka, <code class="il">endl</code> menyebabkan flush berulang dan berujung TLE. Ganti dengan <code class="il">\'\\n\'</code>.</span>';
    } else if (!hasFastIO) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Pasang mantera Fast I/O di baris pertama fungsi <code class="il">main()</code>: <code class="il">ios::sync_with_stdio(0); cin.tie(0);</code>.</span>';
    } else if (!hasCinTie) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Jangan lupa lepaskan ikatan cin dan cout dengan <code class="il">cin.tie(0);</code> agar pembacaan input semakin maksimal.</span>';
    } else if (!hasSlashN) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Gunakan karakter baris baru <code class="il">\'\\n\'</code> untuk berpindah baris secara kilat tanpa flush berlebih.</span>';
    } else {
      fb.className = 'quiz-fb show correct';
      fb.innerHTML = '<span style="font-size:1.2rem">🚀</span> <span><strong>Luar Biasa!</strong> Kodinganmu sudah menerapkan standar Fast I/O lomba CP dengan tepat (mematikan sync C/C++, melepaskan cin.tie, dan memakai \'\\n\'). Solusi ini dijamin lolos batas waktu (Accepted)!</span>';
    }
  } else if (m.id === 3) {
    var hasGrid = /vector\s*<\s*vector\s*<\s*int\s*>\s*>/i.test(code) || /\[\s*105\s*\]\[\s*105\s*\]/i.test(code) || /mat\[/i.test(code) || /grid\[/i.test(code) || /a\[/i.test(code);
    var hasNestedLoop = /for\s*\(.*\)\s*\{?[\s\S]*for\s*\(/i.test(code);
    var hasTransposeAccess = /\[\s*[j]\s*\]\[\s*[i]\s*\]/i.test(code) || /swap\s*\(/i.test(code);

    if (!hasGrid) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Kamu membutuhkan array 2 dimensi atau vector 2D, misalnya <code class="il">vector&lt;vector&lt;int&gt;&gt; mat(n, vector&lt;int&gt;(n));</code> untuk menyimpan matriks N x N.</span>';
    } else if (!hasNestedLoop) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Gunakan perulangan bersarang (nested for loop): loop baris dan loop kolom untuk membaca dan memproses matriks.</span>';
    } else if (!hasTransposeAccess) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Untuk mencetak transpose, tukar urutan indeksnya saat mencetak: <code class="il">cout &lt;&lt; mat[i][j]</code> dengan loop luar j dan loop dalam i, atau gunakan <code class="il">mat[i][j]</code> yang di-swap.</span>';
    } else {
      fb.className = 'quiz-fb show correct';
      fb.innerHTML = '<span style="font-size:1.2rem">🌟</span> <span><strong>Sempurna!</strong> Logika transpose matriks 2D kamu sudah tepat. Baris dan kolom berhasil ditukar dengan rapi! Bandingkan dengan solusi referensi di bawah.</span>';
    }
  } else if (m.id === 4) {
    var hasSort = /sort\s*\(/i.test(code);
    var hasBeginEnd = /begin\s*\(\)/i.test(code) && /end\s*\(\)/i.test(code);
    var hasGreaterOrLambda = /greater\s*<\s*int\s*>/i.test(code) || /a\s*>\s*b/i.test(code) || /rbegin/i.test(code);
    var hasLeq = /<=\s*b/i.test(code) || />=\s*b/i.test(code);

      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">⚠️</span> <span><strong>Bahaya Crash (Strict Weak Ordering)!</strong> Terdeteksi operator <code class="il">&lt;=</code> atau <code class="il">&gt;=</code>. Ingat, di C++ STL kamu WAJIB menggunakan <code class="il">&gt;</code> murni agar tidak terjadi Segmentation Fault.</span>';

      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Panggil fungsi <code class="il">sort(...)</code> dari pustaka algorithm untuk mengurutkan vector.</span>';
    } else if (!hasBeginEnd && !/rbegin/.test(code)) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Pastikan kamu menyertakan rentang iterator: <code class="il">v.begin(), v.end()</code> di dalam panggilan fungsi sort.</span>';

    } else {
      fb.className = 'quiz-fb show correct';
      fb.innerHTML = '<span style="font-size:1.2rem">🎉</span> <span><strong>Luar Biasa!</strong> Kodinganmu sudah menggunakan sort dengan comparator descending yang tepat tanpa pelanggaran Strict Weak Ordering. Bandingkan dengan kode referensi di bawah!</span>';
    }
  } else if (m.id === 5) {
    var hasPairOrStruct = /pair\s*</i.test(code) || /struct\s+\w+/i.test(code);
    var hasSort = /sort\s*\(/i.test(code);
    var hasScoreCompare = /nilai/i.test(code) || /first/i.test(code);
    var hasNameCompare = /nama/i.test(code) || /second/i.test(code);

      fb.className = 'quiz-fb show wrong';

    } else if (!hasScoreCompare || !hasNameCompare) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Aturan pengurutan meminta nilai tertinggi di depan (descending), dan jika nilai sama urutkan nama alfabetis A-Z (ascending). Pastikan komparator memeriksa kedua kondisi ini!</span>';

    }
  } else if (m.id === 6) {
    var hasSet = /set\s*<\s*int\s*>/i.test(code) || /set\s*</i.test(code);
    var hasInsert = /\.insert\s*\(/i.test(code);
    var hasSize = /\.size\s*\(\)/i.test(code);
    var hasLoopSet = /for\s*\(.*:\s*s\)/i.test(code) || /for\s*\(.*:\s*\w+\)/i.test(code);

    if (!hasSet) {

    }
  } else if (m.id === 7) {
    var hasStack = /stack\s*<\s*char\s*>/i.test(code) || /stack\s*</i.test(code);
    var hasPush = /\.push\s*\(/i.test(code);
    var hasPop = /\.pop\s*\(/i.test(code);
    var hasTop = /\.top\s*\(/i.test(code);
    var hasEmpty = /\.empty\s*\(/i.test(code);

    } else if (!hasEmpty) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">⚠️</span> <span><strong>Perhatian:</strong> Jangan lupa cek apakah stack kosong dengan <code class="il">st.empty()</code>! Cek sebelum pop (agar tidak crash jika kurung tutup muncul duluan) dan cek di akhir loop (apakah semua kurung buka sudah ada pasangannya).</span>';
    } else if (!hasSeimbang || !hasTidak) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Pastikan program mencetak <code class="il">SEIMBANG</code> jika valid dan <code class="il">TIDAK</code> jika tidak seimbang.</span>';
    } else {

    }
  } else if (m.id === 8) {
    var hasFastIO = /sync_with_stdio/i.test(code);
    var hasLL = /long\s*long/i.test(code) || /\bll\b/i.test(code);
    var hasSum = /\+=/i.test(code) || /sum/i.test(code) || /total/i.test(code);
    var hasMax = /max\s*\(/i.test(code) || />\s*maks/i.test(code) || />\s*max/i.test(code) || /maksVal/i.test(code);
    var hasCin = /cin\s*>>/i.test(code);

      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Jangan lupa pasang mantera Fast I/O di baris pertama main(): <code class="il">ios::sync_with_stdio(0); cin.tie(0);</code> agar program tidak TLE saat membaca 200.000 data.</span>';
    } else if (!hasSum) {
      fb.className = 'quiz-fb show wrong';
      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Akumulasikan setiap bilangan yang dibaca ke dalam variabel penampung sum: <code class="il">total += x;</code>.</span>';
    } else if (!hasMax) {

      fb.innerHTML = '<span style="font-size:1.2rem">💡</span> <span><strong>Petunjuk:</strong> Perbarui nilai angka terbesar dengan <code class="il">maksVal = max(maksVal, x);</code> atau pengecekan if.</span>';
    } else {

function copyCb(preId){

  var text=el.innerText;
  navigator.clipboard.writeText(text).then(function(){
    var btn=el.nextElementSibling;
    if(btn&&btn.classList.contains('cb-copy')){var o=btn.textContent;btn.textContent='Tersalin!';setTimeout(function(){btn.textContent=o;},1800);}

    var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0;top:0;left:0';
    document.body.appendChild(ta);ta.focus();ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta);
  });
}

// =====================================================================
// SYNTAX HIGHLIGHT
// =====================================================================
function synHl(code){
  var s=code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s=s.replace(/(\/\/[^\n]*)/g,'\x00CM\x01$1\x00/CM\x01');
  s=s.replace(/"([^"\\]*(\\.[^"\\]*)*)"/g,'\x00ST\x01"$1"\x00/ST\x01');
  s=s.replace(/(#\w+)/g,'\x00PP\x01$1\x00/PP\x01');
  s=s.replace(/\b(using|namespace|return|for|while|if|else|auto|bool|char|void|long|short|unsigned|const|struct|class|template|typename|public|private|nullptr|true|false|cin|cout|endl|int)\b/g,'\x00KW\x01$1\x00/KW\x01');
  s=s.replace(/\b(vector|pair|map|set|string|queue|stack|priority_queue|size_t|ll)\b/g,'\x00TY\x01$1\x00/TY\x01');
  s=s.replace(/\b(\d+)\b/g,'\x00NM\x01$1\x00/NM\x01');
  s=s.replace(/\b([a-z_]\w*)\s*(?=\()/g,'\x00FN\x01$1\x00/FN\x01');
  return s
    .replace(/\x00CM\x01([\s\S]*?)\x00\/CM\x01/g,'<span class="cm">$1</span>')
    .replace(/\x00ST\x01([\s\S]*?)\x00\/ST\x01/g,'<span class="st">$1</span>')
    .replace(/\x00PP\x01([\s\S]*?)\x00\/PP\x01/g,'<span class="pp">$1</span>')
    .replace(/\x00KW\x01([\s\S]*?)\x00\/KW\x01/g,'<span class="kw">$1</span>')
    .replace(/\x00TY\x01([\s\S]*?)\x00\/TY\x01/g,'<span class="ty">$1</span>')
    .replace(/\x00NM\x01([\s\S]*?)\x00\/NM\x01/g,'<span class="nm">$1</span>')
    .replace(/\x00FN\x01([\s\S]*?)\x00\/FN\x01/g,'<span class="fn">$1</span>');
}

function esc(s){
  if(s==null)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function markCode(text){
  return esc(text).replace(/`([^`]+)`/g,'<code class="il">$1</code>')
    .replace(/\b(vector|push_back|pop_back|v\.size\(\)|v\.at|\.front\(\)|\.back\(\)|size_t|#include|v\[i\]|v\[0\]|v\[1\]|v\[3\]|push_back\(\)|pop_back\(\)|(int)v\.size\(\))\b/g,function(m){return'<code class="il">'+m+'</code>';});
}

function buildSoalHtml(soal){
  var lines=soal.split('\n');
  if(lines.length===1)return esc(soal);
  var code=lines.slice(1).map(function(l){return l.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}).join('\n');
  return esc(lines[0])+'<br><code style="font-family:var(--mono);font-size:.82rem;background:var(--bg3);padding:5px 10px;border-radius:4px;display:inline-block;margin-top:5px;white-space:pre">'+code+'</code>';
}

function confirmReset(){
  if(!confirm('Reset semua progres belajar? Riwayat modul selesai akan dikembalikan ke awal.'))return;
  state.progress={};saveProgress();renderSidebar();renderHome();
  if(state.page==='module'){var w=document.getElementById('markDoneWrap');if(w)w.innerHTML=buildMarkDone(state.moduleId);}
}
