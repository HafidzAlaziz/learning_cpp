// =====================================================================
// MODUL 7: INTERACTIVE SANDBOX LOGIC (QUEUE, STACK, PRIORITY QUEUE)
// =====================================================================
var sb7Data = {
  q: [],
  st: [],
  pq: []
};

function renderSb7() {
  // Render Queue
  var qEl = document.getElementById('sb7QVis');
  var qFront = document.getElementById('sb7QFront');
  var qSize = document.getElementById('sb7QSize');
  if (qEl) {
    if (sb7Data.q.length === 0) {
      qEl.innerHTML = '<span class="empty-hint">queue kosong</span>';
      if (qFront) qFront.textContent = '-';
      if (qSize) qSize.textContent = '0';
    } else {
      var h = '';
      sb7Data.q.forEach(function(val, idx){
        var isFront = idx === 0;
        h += '<span class="vec-cell" style="width:auto;height:30px;padding:2px 8px;font-size:.78rem;' + (isFront ? 'border-color:var(--success);font-weight:700;' : '') + '">' 
          + (isFront ? '▶ ' : '') + val + '</span>';
      });
      qEl.innerHTML = h;
      if (qFront) qFront.textContent = sb7Data.q[0];
      if (qSize) qSize.textContent = sb7Data.q.length;
    }
  }

  // Render Stack
  var stEl = document.getElementById('sb7StVis');
  var stTop = document.getElementById('sb7StTop');
  var stSize = document.getElementById('sb7StSize');
  if (stEl) {
    if (sb7Data.st.length === 0) {
      stEl.innerHTML = '<span class="empty-hint">stack kosong</span>';
      if (stTop) stTop.textContent = '-';
      if (stSize) stSize.textContent = '0';
    } else {
      var h2 = '';
      sb7Data.st.forEach(function(val, idx){
        var isTop = idx === sb7Data.st.length - 1;
        h2 += '<span class="vec-cell" style="width:70px;height:24px;font-size:.74rem;' + (isTop ? 'border-color:var(--accent);font-weight:700;' : '') + '">' 
          + val + (isTop ? ' ▲' : '') + '</span>';
      });
      stEl.innerHTML = h2;
      if (stTop) stTop.textContent = sb7Data.st[sb7Data.st.length - 1];
      if (stSize) stSize.textContent = sb7Data.st.length;
    }
  }

  // Render Priority Queue
  var pqEl = document.getElementById('sb7PQVis');
  var pqTop = document.getElementById('sb7PQTop');
  var pqSize = document.getElementById('sb7PQSize');
  if (pqEl) {
    if (sb7Data.pq.length === 0) {
      pqEl.innerHTML = '<span class="empty-hint">pq kosong</span>';
      if (pqTop) pqTop.textContent = '-';
      if (pqSize) pqSize.textContent = '0';
    } else {
      var h3 = '';
      sb7Data.pq.forEach(function(val, idx){
        var isTop = idx === 0;
        h3 += '<span class="vec-cell" style="width:auto;height:30px;padding:2px 8px;font-size:.78rem;' + (isTop ? 'border-color:var(--warn);font-weight:700;' : '') + '">' 
          + (isTop ? '👑 ' : '') + val + '</span>';
      });
      pqEl.innerHTML = h3;
      if (pqTop) pqTop.textContent = sb7Data.pq[0];
      if (pqSize) pqSize.textContent = sb7Data.pq.length;
    }
  }
}

function sb7PushVal(val) {
  sb7Data.q.push(val);
  sb7Data.st.push(val);
  sb7Data.pq.push(val);
  sb7Data.pq.sort(function(a, b){ return b - a; }); // Max-Heap sort
  renderSb7();
  var log = document.getElementById('sb7CodeLog');
  if (log) log.innerHTML = '<span style="color:var(--accent);">q.push(' + val + '); st.push(' + val + '); pq.push(' + val + ');</span> // ' + val + ' masuk ke ketiganya!';
}

function sb7PushAll() {
  var inp = document.getElementById('sb7Input');
  var val = inp && inp.value !== '' ? parseInt(inp.value, 10) : Math.floor(Math.random() * 90 + 10);
  sb7PushVal(val);
  if (inp) { inp.value = ''; inp.focus(); }
}

function sb7PushRandom() {
  var val = Math.floor(Math.random() * 90 + 10);
  sb7PushVal(val);
}

function sb7PopQ() {
  var log = document.getElementById('sb7CodeLog');
  if (sb7Data.q.length === 0) {
    if (log) log.innerHTML = '<span style="color:var(--error);">❌ Crash: q.pop() dipanggil saat queue kosong!</span>';
    return;
  }
  var popped = sb7Data.q.shift();
  renderSb7();
  if (log) log.innerHTML = '<span style="color:var(--accent);">q.pop();</span> // Elemen terdepan (' + popped + ') keluar dari queue!';
}

function sb7PopSt() {
  var log = document.getElementById('sb7CodeLog');
  if (sb7Data.st.length === 0) {
    if (log) log.innerHTML = '<span style="color:var(--error);">❌ Crash: st.pop() dipanggil saat stack kosong!</span>';
    return;
  }
  var popped = sb7Data.st.pop();
  renderSb7();
  if (log) log.innerHTML = '<span style="color:var(--accent);">st.pop();</span> // Elemen pucuk (' + popped + ') keluar dari stack!';
}

function sb7PopPQ() {
  var log = document.getElementById('sb7CodeLog');
  if (sb7Data.pq.length === 0) {
    if (log) log.innerHTML = '<span style="color:var(--error);">❌ Crash: pq.pop() dipanggil saat priority_queue kosong!</span>';
    return;
  }
  var popped = sb7Data.pq.shift();
  renderSb7();
  if (log) log.innerHTML = '<span style="color:var(--warn);">pq.pop();</span> // Elemen terbesar (' + popped + ') keluar dari heap!';
}

function sb7ClearAll() {
  sb7Data = { q: [], st: [], pq: [] };
  renderSb7();
  var log = document.getElementById('sb7CodeLog');
  if (log) log.innerHTML = '// Semua wadah di-reset kosong.';
}

function renderSb8() {
  var codeEl = document.getElementById('sb8BoilerplateCode');
  if (!codeEl) return;

  var fastIO = document.getElementById('sb8OptFastIO') ? document.getElementById('sb8OptFastIO').checked : true;
  var shortcuts = document.getElementById('sb8OptShortcuts') ? document.getElementById('sb8OptShortcuts').checked : true;

  var multiTest = document.getElementById('sb8OptMultiTest') ? document.getElementById('sb8OptMultiTest').checked : false;

  var lines = [];
  lines.push('#include <bits/stdc++.h>');
  lines.push('using namespace std;');
  lines.push('');

  if (shortcuts) {
    lines.push('// Singkatan Tipe Data');
    lines.push('using ll = long long;');
    lines.push('using pii = pair<int, int>;');
    lines.push('using vi = vector<int>;');
    lines.push('');
  }

  if (macro) {
    lines.push('// Makro Cepat');
    lines.push('#define all(x) (x).begin(), (x).end()');
    lines.push('#define sz(x) (int)(x).size()');
    lines.push('');
  }

  if (multiTest) {
    lines.push('void solve() {');
    lines.push('    // Logika solusi per test case di sini:');
    lines.push('    ');
    lines.push('}');
    lines.push('');
    lines.push('int main() {');
    if (fastIO) {
      lines.push('    ios::sync_with_stdio(0);');
      lines.push('    cin.tie(0);');
      lines.push('');
    }
    lines.push('    int t;');
    lines.push('    if (cin >> t) {');
    lines.push('        while (t--) {');
    lines.push('            solve();');
    lines.push('        }');
    lines.push('    }');
    lines.push('    return 0;');
    lines.push('}');
  } else {
    lines.push('int main() {');
    if (fastIO) {
      lines.push('    ios::sync_with_stdio(0);');
      lines.push('    cin.tie(0);');
      lines.push('');

    lines.push('    // Tulis logika solusimu di sini:');

function sb8UpdateInputs() {
  var sel = document.getElementById('sb8TypeSel');
  var a = document.getElementById('sb8ValA');
  var b = document.getElementById('sb8ValB');
  if (!sel || !a || !b) return;

  if (sel.value === 'int') {
    a.value = '15';
    b.value = '42';
  } else if (sel.value === 'double') {
    a.value = '8.75';
    b.value = '3.14';
  } else if (sel.value === 'string') {
    a.value = 'kucing';
    b.value = 'zebra';
  }
  sb8RunGeneric();
}

function sb8RunGeneric() {
  var sel = document.getElementById('sb8TypeSel');
  var aInp = document.getElementById('sb8ValA');
  var bInp = document.getElementById('sb8ValB');
  var res = document.getElementById('sb8GenericResult');
  if (!sel || !aInp || !bInp || !res) return;

  var type = sel.value;
  var valA = aInp.value;
  var valB = bInp.value;
  var winner, parsedA, parsedB;

  if (type === 'int') {
    parsedA = parseInt(valA, 10) || 0;
    parsedB = parseInt(valB, 10) || 0;
    winner = (parsedA > parsedB) ? parsedA : parsedB;
  } else if (type === 'double') {
    parsedA = parseFloat(valA) || 0;
    parsedB = parseFloat(valB) || 0;
    winner = (parsedA > parsedB) ? parsedA : parsedB;
  } else {
    parsedA = valA;
    parsedB = valB;
    winner = (parsedA > parsedB) ? parsedA : parsedB;
  }

  res.innerHTML = '⚙️ <strong>Kompilasi C++ Template:</strong><br>'
    + '• Kompiler menginstansiasi: <code class="il">hitungMaks&lt;' + type + '&gt;(' + valA + ', ' + valB + ')</code><br>'
    + '• Placeholder <code class="il">T</code> otomatis diganti menjadi: <strong style="color:var(--accent);">' + type + '</strong><br>'
    + '• Nilai Maksimum yang Dihasilkan: <strong style="color:var(--success);font-size:1.1rem;">' + winner + '</strong> 🎉';
}
